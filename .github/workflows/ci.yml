name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: Check runner Chrome
        run: google-chrome --version

      - name: Run multiplayer smoke test
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:e2e
